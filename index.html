<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
</head>
<body>
    <h2>Score: <span id="score">0</span></h2>
    <canvas id="canvas" height="400" width="400" style="background: #000;"></canvas>
    <audio src="sunflower.mp3" autoplay></audio>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let size = 20,score = 0;
        let snake = [{x:200,y: 200}];
        let food = {x: 100, y: 100};
        let dx = size, dy = 0;

        function gameLoop(){
            //Move Head
            let head = {x: snake[0].x + dx, y: snake[0].y + dy}


            // define gameover

            if(head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400 || snake.some(p => p.x ===head.x && p.y === head.y)){
                alert("GameOver");
                return location.reload();
            }
            snake.unshift(head);

            if(head.x === food.x && head.y === food.y){
                score++;
                document.getElementById("score").innerHTML = score;
                //Change food position
                food = {
                    x: Math.floor(Math.random() * 20 )* size,
                    y: Math.floor(Math.random() * 20) * size
                    
                }
            }else{
            snake.pop();
            }
            setTimeout(gameLoop, 100);

            //Draw Everything
            //clear Rectangle
            ctx.clearRect(0, 0, 400, 400);
            // Draw Food
            ctx.fillStyle = "red";
            ctx.fillRect(food.x,food.y,size - 2, size - 2);
            // Draw Snake 
            ctx.fillStyle = "lime";
            snake.forEach(p => ctx.fillRect(p.x, p.y, size - 2, size - 2))
        }

        // controls
        window.addEventListener("keydown", e =>{ 
            if(e.key === "ArrowUp" && dy === 0){
                dx = 0; dy = -size;
            }
            if(e.key === "ArrowDown" && dy === 0){
                dx = 0; dy = size;
            }
            if(e.key === "ArrowLeft" && dx === 0){
                dx = -size; dy = 0;
            }
            if(e.key === "ArrowRight" && dx === 0){
                dx = size; dy = 0;
            }
        })

        gameLoop();
    </script>
</body>
</html>
